<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --ink: #1c1917;
      --muted: #78716c;
      --border: #e7e5e4;
      --good: #15803d;
      --warn: #b45309;
      --risk: #b91c1c;
      --bg: #fafaf9;
      --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Charter", "Bitstream Charter", Georgia, serif;
      font-size: 18px;
      line-height: 1.7;
      color: var(--ink);
      background: var(--bg);
      padding: 2.5rem 1.5rem 4rem;
    }
    .page {
      max-width: 680px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 3rem 3.25rem;
    }
    .eyebrow {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.65rem;
      font-weight: 400;
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .lead {
      font-size: 1.15rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      color: #292524;
    }
    .content h2 {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 2rem 0 0.85rem;
      color: var(--muted);
    }
    .content p { margin-bottom: 1rem; }
    .content ul { margin: 0 0 1rem 1.25rem; }
    .content li { margin-bottom: 0.5rem; }
    .content strong { font-weight: 600; }
    .callout {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
      border-radius: 4px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .callout.good { background: #f0fdf4; border-left: 3px solid var(--good); }
    .callout.warn { background: #fffbeb; border-left: 3px solid var(--warn); }
    .callout.risk { background: #fef2f2; border-left: 3px solid var(--risk); }
    .footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.7rem;
      color: var(--muted);
    }
    @media print {
      body { background: white; padding: 0; }
      .page { border: none; padding: 0; }
    }
  </style>
</head>
<body>
  <article class="page">
    <div class="eyebrow">Executive Brief</div>
    <h1>{{TITLE}}</h1>
    <div class="subtitle">{{PROJECT}} · {{DATE}}</div>
    <div class="lead">{{LEAD}}</div>
    <div class="content">
      {{CONTENT}}
    </div>
    <div class="footer">PM-Kit · /report · Not for technical distribution</div>
  </article>
</body>
</html>
