<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --ink: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #1d4ed8;
      --accent-light: #eff6ff;
      --bg: #f3f4f6;
      --card: #ffffff;
      --p0: #dc2626;
      --p1: #d97706;
      --p2: #059669;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--bg);
      padding: 2rem 1rem 4rem;
    }
    .page {
      max-width: 820px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .header {
      background: linear-gradient(135deg, #1e3a5f 0%, #1d4ed8 100%);
      color: white;
      padding: 2.5rem 3rem;
    }
    .header .label {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.8;
      margin-bottom: 0.5rem;
    }
    .header h1 {
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }
    .header .meta { font-size: 0.85rem; opacity: 0.85; }
    .body { padding: 2.5rem 3rem 3rem; }
    .content h2 {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--accent);
      margin: 2.25rem 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--accent-light);
    }
    .content h2:first-child { margin-top: 0; }
    .content h3 { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 0.5rem; }
    .content p { margin-bottom: 1rem; color: #374151; }
    .content ul, .content ol { margin: 0 0 1rem 1.5rem; color: #374151; }
    .content li { margin-bottom: 0.4rem; }
    .content table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0 1.5rem;
      font-size: 0.9rem;
    }
    .content th, .content td {
      border: 1px solid var(--border);
      padding: 0.6rem 0.85rem;
      text-align: left;
    }
    .content th { background: var(--accent-light); font-weight: 600; color: var(--accent); }
    .content blockquote {
      background: var(--accent-light);
      border-left: 4px solid var(--accent);
      padding: 1rem 1.25rem;
      margin: 1rem 0;
      border-radius: 0 4px 4px 0;
      color: #1e40af;
    }
    .content a { color: var(--accent); }
    .content code {
      font-family: "SF Mono", Menlo, monospace;
      font-size: 0.85em;
      background: #f3f4f6;
      padding: 0.15em 0.4em;
      border-radius: 3px;
    }
    .footnotes {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
    }
    .footnotes h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.75rem; }
    .footnotes ol { margin-left: 1.25rem; }
    .footer {
      padding: 1rem 3rem;
      background: #f9fafb;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--muted);
    }
    @media print {
      body { background: white; padding: 0; }
      .page { box-shadow: none; }
      .header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <article class="page">
    <header class="header">
      <div class="label">Product Document</div>
      <h1>{{TITLE}}</h1>
      <div class="meta">{{PROJECT}} · {{DATE}} · {{STATUS}}</div>
    </header>
    <div class="body">
      <div class="content">
        {{CONTENT}}
      </div>
      {{FOOTNOTES}}
    </div>
    <div class="footer">Source: {{SOURCE_PATH}} · PM-Kit preview</div>
  </article>
</body>
</html>
